# Render blueprint. Commit this file, then on render.com choose
# New > Blueprint and point it at your repo — Render reads everything below.
#
# Configured for the FREE plan. Data persists in Neon Postgres (DATABASE_URL),
# so it survives restarts — see the note at the bottom.
services:
  - type: web
    name: gentletrike
    runtime: node
    plan: free
    region: singapore # closest Render region to the Philippines

    # --include=dev is defensive. NODE_ENV=production below sets npm's
    # omit=dev, which skips the direct devDependencies that `npm run build`
    # needs (esbuild, tailwindcss). Today the build survives anyway because
    # both arrive as transitive deps of vite and @tailwindcss/vite, which are
    # production deps — but that is an accident of hoisting, not a guarantee.
    # The flag makes the build independent of it.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      # Node runtime version — the project's baseline.
      - key: NODE_VERSION
        value: "24"
      # Set the actual values in the Render dashboard (Environment tab).
      # sync:false means "prompt me for this, don't read it from the repo",
      # which keeps the secret out of git.
      #
      # The Neon Postgres connection string. REQUIRED — the app stores all data
      # here so it persists across restarts and redeploys.
      - key: DATABASE_URL
        sync: false
      # Powers "Gently", the passenger AI guide. Without it the assistant falls
      # back to a deterministic mock that prefixes every reply with "[mock]" —
      # fine for UI work, not for a demo. The knowledge base itself lives in
      # Postgres, so a deploy needs no ingest; only this key.
      - key: OPENAI_API_KEY
        sync: false
      # Powers the TMO admin dashboard's free-text box only — NOT Gently.
      # Without it that box still answers the built-in statistics queries.
      - key: GEMINI_API_KEY
        sync: false
      # ---------------------------------------------------------------------
      # Build-time variables. These two are baked into the browser bundle by
      # Vite during `npm run build`, NOT read at runtime — so they must exist
      # when the build runs, and changing them later needs a fresh deploy, not
      # a restart.
      #
      # Missing them fails silently and looks like a bug in the app: the map
      # container renders, stays grey, and no pins appear. Worth checking first
      # whenever a deployed map is blank while localhost is fine.
      # ---------------------------------------------------------------------
      # Browser-side Maps key. Restrict it by HTTP referrer to the Render URL —
      # it ships inside the bundle and is readable by anyone.
      - key: VITE_GOOGLE_MAPS_BROWSER_KEY
        sync: false
      # Vector Map ID. Advanced markers refuse to render without one, so an
      # absent value costs every pin on the map.
      - key: VITE_GOOGLE_MAPS_MAP_ID
        sync: false
      # Server-side Maps key, for routing, geocoding and place search. Separate
      # from the browser key so it can stay unrestricted by referrer while the
      # public one cannot.
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
# ---------------------------------------------------------------------------
# Persistence
#
# Data lives in Neon Postgres (set DATABASE_URL above), so it survives restarts
# and redeploys — no server disk needed. Render's own filesystem is still
# ephemeral, but the app no longer writes anything to it.
# ---------------------------------------------------------------------------
